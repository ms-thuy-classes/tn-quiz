<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">Quiz · Learn with Ms. Thúy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..900&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- CSS chính -->
<link rel="stylesheet" href="styles.css">
<!-- CSS bổ trợ cho các dạng câu hỏi (mcq-img, fill, para, listening, …) 
</head>
<body class="post">
  <div class="bg-dots"></div>
  <canvas id="confettiCanvas"></canvas>

  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-badge">M</span>
      <div>
        <span class="brand-name">Learn with <em>Ms. Thúy</em></span>
        <span class="brand-sub">English · Quiz</span>
      </div>
    </a>
    <button id="soundBtn" class="icon-btn" aria-pressed="true" title="Bật/tắt âm thanh">🔊</button>
  </header>

  <main>
    <!-- MÀN 1: Intro -->
    <section class="screen active" id="screenIntro">
      <div class="intro-grid">
        <div class="intro-copy">
          <span class="eyebrow" id="introEyebrow">📘 Quiz</span>
          <h1 class="display" id="introTitle">—</h1>
          <p class="lede" id="introDesc"></p>
          <ul class="chips" id="introChips"></ul>
          <form id="startForm" class="start-form">
            <label class="field-label" for="playerName">Tên của em</label>
            <div class="field-row">
              <input id="playerName" type="text" maxlength="30" autocomplete="name" placeholder="VD: Minh Anh" required>
              <button type="submit" class="btn btn-primary">Bắt đầu làm bài →</button>
            </div>
            <p class="hint">✨ Đáp án đúng chỉ hé lộ ở phần <b>tổng kết cuối bài</b>. Nhấn <b>Enter</b> để xác nhận đáp án dạng điền từ.</p>
          </form>
        </div>
        <div class="intro-visual" id="introVisual"></div>
      </div>
      <footer class="foot">Made with 💜 by Ms. Thúy</footer>
    </section>

    <!-- MÀN 2: Quiz -->
    <section class="screen" id="screenQuiz" hidden>

      <!-- Quiz Header: Timer, Exit, Progress, Score -->
      <div class="quiz-header" id="quizHeader">
        <div class="quiz-header-top">
          <button id="exitBtn" class="icon-btn" title="Thoát" style="margin-right:8px;">✕</button>

          <div class="timer-pill" id="timerPill">
            <span>⏱️</span>
            <span id="timerDisplay">00:00</span>
          </div>

          <div class="question-counter">
            Câu <b id="qNow">1</b> / <b id="qTotal">0</b>
          </div>

          <div class="score-pill" id="liveScore">✓ 0 (0.0đ)</div>
        </div>

        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>
      <!-- Hết Quiz Header -->

      <div class="q-stage" id="qStage"></div>
      <div class="sr-only" aria-live="polite" id="ariaFeedback"></div>
    </section>

    <!-- MÀN 3: Result -->
    <section class="screen" id="screenResult" hidden>
      <div class="result-wrap" id="resultWrap"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-back" data-close></div>
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <p id="modalMsg"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close>Ở lại</button>
        <button class="btn btn-danger" id="modalOk">Đồng ý</button>
      </div>
    </div>
  </div>

<!-- ============================================================
     SCRIPTS — thứ tự BẮT BUỘC:
       1. core.js         → esc, shuffle, REDUCED, toast, modal, confetti, registry
       2. types/*.js      → đăng ký QuizTypes[type]
       3. quiz-engine.js  → định nghĩa initPostPage()
       4. bootstrap       → gọi initPostPage() an toàn
     ============================================================ -->

<!-- 1) Core utilities -->
<script src="js/core.js"></script>

<!-- 2) Question types (mcq PHẢI load trước mcq-img vì mcq-img tái dùng attach) -->
<script src="js/types/mcq.js"></script>
<script src="js/types/mcq-img.js"></script>
<script src="js/types/fill.js"></script>
<script src="js/types/type-in.js"></script>
<script src="js/types/type-in-para.js"></script>
<script src="js/types/matching.js"></script>
<script src="js/types/listening.js"></script>

<!-- 3) Engine -->
<script src="js/quiz-engine.js"></script>

<!-- 4) Bootstrap an toàn -->
<script>
(function () {
  function boot() {
    if (typeof initPostPage !== 'function') {
      document.body.innerHTML =
        '<div style="max-width:520px;margin:100px auto;padding:30px;' +
        'background:#fff;border-radius:22px;text-align:center;' +
        'box-shadow:0 10px 30px rgba(60,50,120,.12);font-family:Be Vietnam Pro,sans-serif">' +
          '<div style="font-size:3rem;margin-bottom:10px">⚠️</div>' +
          '<h2 style="font-family:Fraunces,serif;font-size:1.6rem;margin-bottom:12px">Không tải được engine</h2>' +
          '<p style="color:#5d5e7e;margin-bottom:18px">' +
            'File <b>js/quiz-engine.js</b> chưa được nạp hoặc bị lỗi cú pháp. ' +
            'Em mở <b>DevTools → Console</b> để xem chi tiết nhé.' +
          '</p>' +
          '<a href="index.html" class="btn btn-primary" ' +
          'style="display:inline-block;padding:10px 20px;background:#7a67ee;color:#fff;' +
          'border-radius:10px;text-decoration:none">← Về trang chủ</a>' +
        '</div>';
      return;
    }
    try {
      initPostPage();
    } catch (err) {
      console.error('[post.html] initPostPage lỗi:', err);
      document.body.innerHTML =
        '<div style="max-width:520px;margin:100px auto;padding:30px;' +
        'background:#fff;border-radius:22px;text-align:center;' +
        'box-shadow:0 10px 30px rgba(60,50,120,.12);font-family:Be Vietnam Pro,sans-serif">' +
          '<div style="font-size:3rem;margin-bottom:10px">😢</div>' +
          '<h2 style="font-family:Fraunces,serif;font-size:1.6rem;margin-bottom:12px">Có lỗi khi khởi động</h2>' +
          '<p style="color:#5d5e7e;margin-bottom:18px">' + (err && err.message ? err.message : 'Lỗi không xác định') + '</p>' +
          '<a href="index.html" class="btn btn-primary" ' +
          'style="display:inline-block;padding:10px 20px;background:#7a67ee;color:#fff;' +
          'border-radius:10px;text-decoration:none">← Về trang chủ</a>' +
        '</div>';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
